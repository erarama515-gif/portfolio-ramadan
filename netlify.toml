# Netlify build configuration
# المشروع يحوي مجلدين: frontend + backend
# Netlify يبني الـ frontend فقط (الـ backend منشور على Render)

[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION   = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify يكتشف Next.js تلقائياً ويفعّل @netlify/plugin-nextjs
# Netlify auto-detects Next.js and enables @netlify/plugin-nextjs

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
