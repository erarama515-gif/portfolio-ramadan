# Render Blueprint — Backend + PostgreSQL (Free tier)
# اضغط "Deploy to Render" أو ادفع المشروع على GitHub ثم New Blueprint → اختر الريبو
#
# https://render.com/docs/blueprint-spec

services:
  # ────────────────────────────────────────────────
  # FastAPI Backend (Python web service)
  # ────────────────────────────────────────────────
  - type: web
    name: portfolio-api
    runtime: python
    region: frankfurt          # أقرب منطقة لمصر (تأخير أقل)
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.initial_data.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true     # Render يولّد سر عشوائي تلقائياً
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        sync: false             # ⚠ يجب ضبطها يدوياً برابط Netlify بعد النشر
                                #    مثال: https://your-site.netlify.app

# ────────────────────────────────────────────────
# PostgreSQL Database
# ────────────────────────────────────────────────
databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
    region: frankfurt
    plan: free                  # 1 GB · ينتهي تلقائياً بعد 90 يوم على الخطة المجانية
